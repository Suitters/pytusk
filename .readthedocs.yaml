# .readthedocs.yaml
# Read the Docs configuration file

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.10"
  jobs:
    post_create_environment:
      - pip install sphinx==8.1.3 sphinx-rtd-theme==3.0.2
    pre_build:
      - sphinx-apidoc -o doc/source pytusk/ pytusk/tusky

sphinx:
  configuration: doc/source/conf.py

python:
  install:
    - method: pip
      path: .
